micronova:
  enable_rx_pin: ${enable_rx_pin}

button:
  - platform: micronova
    custom_button:
      name: Custom Micronova Button
      memory_location: 0x20
      memory_address: 0x7D
      memory_data: 0x0F

number:
  - platform: micronova
    thermostat_temperature:
      name: Micronova Thermostaat
      step: 1
    power_level:
      name: Micronova Power level
      update_interval: 10s
    memory_address_number:
      - name: Memory Address Number Default
        memory_location: 0x20
        memory_address: 0x60
        min_value: 0
        max_value: 100
        step: 1
      - name: Memory Address Number Transform
        id: my_memory_address_number_transform
        memory_location: 0x20
        memory_address: 0x80
        min_value: 0.0
        max_value: 50.0
        step: 0.5
        multiply: 0.5
        offset: 10.0

sensor:
  - platform: micronova
    room_temperature:
      name: Room Temperature
    fumes_temperature:
      name: Fumes Temperature
    water_temperature:
      name: Water temperature
    water_pressure:
      name: Water pressure
    stove_power:
      name: Stove Power
    fan_speed:
      fan_rpm_offset: 240
      name: Fan RPM
    memory_address_sensor:
      memory_location: 0x20
      memory_address: 0x7d
      name: Adres sensor

switch:
  - platform: micronova
    stove:
      name: Stove

text_sensor:
  - platform: micronova
    stove_state:
      name: Stove status
      update_interval: 5s
